name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Prevent concurrent runs on the same ref (e.g. rapid pushes to the same branch)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 1 — test
  # Runs on every push and PR.
  # Creates an ephemeral Neon branch, runs migrations, runs the test scripts,
  # then unconditionally deletes the branch (even on failure).
  # ──────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Create a short, unique branch name based on the run ID so parallel runs
      # don't collide and the branch name is easy to trace back to the run.
      - name: Set Neon branch name
        id: branch-name
        run: echo "name=ci-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Create ephemeral Neon branch
        id: neon-branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ${{ steps.branch-name.outputs.name }}

      # Debug: print the raw URL format from Neon with credentials masked.
      # The correct v6 output is db_url_pooled (db_url_with_pooler does not exist).
      # Never print raw credentials — sed replaces the password segment with ****.
      - name: Debug — masked DB URL format from Neon
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url_pooled }}
        run: |
          echo "Masked URL: $(echo "$DATABASE_URL" | sed -E 's/:[^:@]+@/:****@/')"

      # Run migrations against the ephemeral branch.
      # create-branch-action@v6 outputs db_url_pooled which uses the postgres://
      # scheme (shorthand). Both postgres:// and postgresql:// must be rewritten
      # to postgresql+asyncpg:// for SQLAlchemy async engines.
      # We rewrite once here and export to GITHUB_ENV so all later steps
      # automatically inherit the corrected URL.
      - name: Rewrite DB URL and run alembic migrations
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url_pooled }}
        run: |
          ASYNC_URL=$(echo "$DATABASE_URL" | sed -E 's|^postgres(ql)?://|postgresql+asyncpg://|')
          echo "ASYNC_DATABASE_URL=$ASYNC_URL" >> "$GITHUB_ENV"
          DATABASE_URL="$ASYNC_URL" alembic upgrade head

      # ── Test scripts ────────────────────────────────────────────────────────
      # Each script is independent. Run them sequentially so failures are easy
      # to attribute. All env vars that scripts read from .env are injected
      # here as process-level environment variables (no .env file on CI).
      - name: Test — GitHub client (API-only, no DB)
        env:
          TEST_GITHUB_PAT: ${{ secrets.TEST_GITHUB_PAT }}
        run: python scripts/test_github_client.py

      - name: Test — sync repos
        env:
          DATABASE_URL: ${{ env.ASYNC_DATABASE_URL }}
          TEST_GITHUB_PAT: ${{ secrets.TEST_GITHUB_PAT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          GITHUB_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.G_CLIENT_SECRET }}
          REDIS_URL: redis://localhost:6379/0
        run: python scripts/test_sync_repos.py

      - name: Test — sync commits
        env:
          DATABASE_URL: ${{ env.ASYNC_DATABASE_URL }}
          TEST_GITHUB_PAT: ${{ secrets.TEST_GITHUB_PAT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          GITHUB_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.G_CLIENT_SECRET }}
          REDIS_URL: redis://localhost:6379/0
        run: python scripts/test_sync_commits.py

      - name: Test — compute daily snapshots
        env:
          DATABASE_URL: ${{ env.ASYNC_DATABASE_URL }}
          TEST_GITHUB_PAT: ${{ secrets.TEST_GITHUB_PAT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          GITHUB_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.G_CLIENT_SECRET }}
          REDIS_URL: redis://localhost:6379/0
        run: python scripts/test_compute_daily_snapshots.py

      - name: Test — stats summary endpoint
        env:
          DATABASE_URL: ${{ env.ASYNC_DATABASE_URL }}
          TEST_GITHUB_PAT: ${{ secrets.TEST_GITHUB_PAT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          GITHUB_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.G_CLIENT_SECRET }}
          REDIS_URL: redis://localhost:6379/0
        run: python scripts/test_stats_summary.py

      - name: Test — cache behavior
        env:
          DATABASE_URL: ${{ env.ASYNC_DATABASE_URL }}
          TEST_GITHUB_PAT: ${{ secrets.TEST_GITHUB_PAT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          GITHUB_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.G_CLIENT_SECRET }}
          REDIS_URL: redis://localhost:6379/0
        run: python scripts/test_cache_behavior.py

      - name: Test — activity pattern endpoint
        env:
          DATABASE_URL: ${{ env.ASYNC_DATABASE_URL }}
          TEST_GITHUB_PAT: ${{ secrets.TEST_GITHUB_PAT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          GITHUB_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.G_CLIENT_SECRET }}
          REDIS_URL: redis://localhost:6379/0
        run: python scripts/test_activity_pattern.py

      # ── Cleanup — always runs, even if earlier steps failed ─────────────────
      - name: Delete ephemeral Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.branch-name.outputs.name }}

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 2 — build
  # Runs on every push and PR, after test passes.
  # Proves the Dockerfile builds cleanly. Does NOT push anywhere.
  # ──────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: github-activity-analyst:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 3 — deploy
  # Runs ONLY on push to main, after both test and build pass.
  # Uses Railway CLI (railway up --ci) with a project token.
  # ──────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: railway up --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
