services:

  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override REDIS_URL so the app reaches the redis service by its
      # Compose service name instead of localhost (which is the default
      # in app/config.py for local dev).  Process-env vars take priority
      # over both the .env file and the pydantic-settings default, so
      # no change to app/config.py is required.
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
